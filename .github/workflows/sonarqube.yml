name: SonarQube
on:
  workflow_call:

jobs:
  build:
    name: SonarQube Cloud Code Quality Analysis
    runs-on: ubuntu-latest
    environment: pr-checks
    permissions:
      contents: read
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Set up .NET
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: '10.0'
      - name: Checkout analyzed commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Sonar needs full history for blame
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Download Unit Test Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage
      - name: Download Functional Test Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-functional
          path: coverage
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner
      - name: Build and analyze (pull request)
        if: github.event_name == 'pull_request_target'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_KEY: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin /k:"flow-OverStack_UserService" /o:"flow-overstack" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="coverage/coverage-unit.xml,coverage/coverage-functional.xml" /d:sonar.pullrequest.key="$PR_KEY" /d:sonar.pullrequest.branch="$PR_BRANCH" /d:sonar.pullrequest.base="$PR_BASE" /d:sonar.scm.revision="$PR_SHA"
          dotnet build
          ./.sonar/scanner/dotnet-sonarscanner end
      - name: Build and analyze (branch)
        if: github.event_name != 'pull_request_target'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin /k:"flow-OverStack_UserService" /o:"flow-overstack" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="coverage/coverage-unit.xml,coverage/coverage-functional.xml" /d:sonar.branch.name="${{ github.ref_name }}"
          dotnet build
          ./.sonar/scanner/dotnet-sonarscanner end